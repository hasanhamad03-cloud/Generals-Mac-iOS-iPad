name: Build iOS Game App

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile and Package C&C Generals for iOS
    runs-on: macos-14
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup CMake and Ninja
        run: |
          brew install cmake ninja
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Fetch and Stage MoltenVK Framework
        run: |
          chmod +x ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage Game Fonts
        run: |
          chmod +x ./scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Inject Freetype Downloader into CMake
        run: |
          # حقن كود جلب مكتبة فري تايب المخصصة للـ آي أو إس مباشرة بأول ملف كولونيل للمشروع
          sed -i '' '1s/^/include(FetchContent)\nFetchContent_Declare(Freetype URL https:\/\/download.savannah.gnu.org\/releases\/freetype\/freetype-2.13.2.tar.gz)\nFetchContent_MakeAvailable(Freetype)\nset(FREETYPE_INCLUDE_DIRS ${freetype_SOURCE_DIR}\/include CACHE PATH "" FORCE)\nset(FREETYPE_LIBRARIES freetype CACHE STRING "" FORCE)\n/' Core/Libraries/Source/WwVegas/WW3D2/CMakeLists.txt

      - name: Configure CMake for iOS Vulkan
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cmake -B build/ios-vulkan \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGENERALS_IOS=ON \
            -DSAGE_USE_DETERMINISTIC_MATH=OFF

      - name: Build Game Target Executable
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cmake --build build/ios-vulkan --target z_generals --config Release

      - name: Unsigned App Packaging
        run: |
          chmod +x ./scripts/build/ios/package-ios-zh.sh
          GX_TEAM_ID=0000000000 GX_BUNDLE_ID=com.clover.generalszh ./scripts/build/ios/package-ios-zh.sh --dev || true
          mkdir -p build_output/Payload
          if [ -d "build/ios-vulkan/z_generals.app" ]; then
            cp -R build/ios-vulkan/z_generals.app build_output/Payload/
          else
            mkdir -p build_output/Payload/z_generals.app
            cp -R build/ios-vulkan/Main/Release-iphoneos/*.app build_output/Payload/ || true
          fi
          cd build_output && zip -r ../GeneralsZH_Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals-ZeroHour-iOS-IPA
          path: GeneralsZH_Unsigned.ipa
          retention-days: 7